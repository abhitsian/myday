<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>myday</title>
<style>
:root{
  --bg:#f7f6f3; --card:#fffefc; --ink:#1a1a18; --mut:#6b6862; --faint:#9c988f; --line:#e6e3dc;
  --accent:#4a5d7e; --warn:#b0762a;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  /* Four steps, ~1.25 between each. A list you scan needs the title to win on size;
     everything below it separates by weight and colour instead of by another half-pixel. */
  --t-xs:11px;    /* mono meta — chips, pills, the time gutter, footer */
  --t-sm:13.5px;  /* prose — summaries, bodies, inputs */
  --t-md:17px;    /* entry titles */
  --t-lg:22px;    /* page title */
  --t-xl:34px;    /* hero numbers on the home view */

  /* Categorical series, validated for CVD and contrast in both modes. Fixed order,
     never cycled, and assigned per app name so a filter cannot repaint the survivors. */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --grid:rgba(0,0,0,.07);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#16161a; --card:#1e1e23; --ink:#eceae6; --mut:#9d9a94; --faint:#6d6a65; --line:#2c2c33;
         --accent:#8fa8cd; --warn:#d5a24f;
         /* Same eight hues re-stepped for the dark surface, not an automatic flip. */
         --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
         --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
         --grid:rgba(255,255,255,.09); }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:28px 22px 80px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:var(--t-lg);margin:0;letter-spacing:-.02em;font-weight:600}
h1 span{color:var(--faint);font-weight:400}
.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-family:var(--mono);font-size:var(--t-xs);color:var(--mut)}
.pill b{color:var(--ink)}
select,input{font-family:var(--sans);font-size:var(--t-sm);background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:8px 11px;outline:none}
select:focus,input:focus{border-color:var(--mut)}
#q{width:100%;margin-bottom:14px;padding:10px 13px}
.warn{background:color-mix(in oklab,var(--warn) 8%,var(--card));border:1px solid color-mix(in oklab,var(--warn) 28%,var(--line));
  color:var(--warn);border-radius:10px;padding:9px 13px;font-family:var(--mono);font-size:var(--t-xs);line-height:1.7;margin-bottom:14px}
/* Timeline: a rail down the left, one event per note. The dot and connector carry the
   grouping, so rows need no dividing borders. */
.e{display:flex;gap:0;position:relative}
.etime{width:78px;flex:none;text-align:right;padding:14px 14px 0 0;font-family:var(--mono);
  font-size:var(--t-xs);color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.erail{width:17px;flex:none;position:relative}
.erail::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--line)}
.e:first-child .erail::before{top:19px}
.e:last-child .erail::before{bottom:auto;height:19px}
.edot{position:absolute;left:4px;top:19px;width:9px;height:9px;border-radius:50%;
  background:var(--card);border:2px solid var(--faint);z-index:1}
.e.now .edot{border-color:var(--s1);background:var(--s1)}
.emain{flex:1;min-width:0;padding:13px 0 17px 12px}
.eti{font-size:var(--t-md);font-weight:600;letter-spacing:-.01em;cursor:pointer;line-height:1.3}
.eti:hover{color:var(--accent)}
.esu{font-size:var(--t-sm);color:var(--mut);line-height:1.55;margin-top:4px}
/* Real app marks. Identity rides on the icon, with the name in the tooltip, so nothing
   depends on recognising a colour. */
.eicons{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.eicons img{width:19px;height:19px;border-radius:4px;object-fit:contain}
.eicons .site{font-family:var(--mono);font-size:var(--t-xs);color:var(--mut);background:var(--grid);
  border-radius:5px;padding:2px 6px}
.ebody{margin-top:10px;padding:11px 13px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;font-size:var(--t-sm);line-height:1.7;color:var(--mut);white-space:pre-wrap}
.x{flex:none;align-self:flex-start;margin-top:14px;background:none;border:none;color:var(--faint);
  font-size:var(--t-md);line-height:1;cursor:pointer;padding:2px 5px;opacity:0}
.e:hover .x{opacity:1}
.x:hover{color:#c0504d}
.none{font-family:var(--mono);font-size:var(--t-sm);color:var(--faint);background:var(--card);
  border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;line-height:1.9}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{font-family:var(--sans);font-size:var(--t-sm);background:none;border:none;border-bottom:2px solid transparent;
  color:var(--mut);padding:8px 12px;cursor:pointer;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:var(--t-sm)}
.rname{width:170px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.rbar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.rval{width:74px;text-align:right;font-family:var(--mono);font-size:var(--t-xs);color:var(--mut);font-variant-numeric:tabular-nums}
.sub{font-family:var(--mono);font-size:var(--t-xs);color:var(--faint);margin:14px 0 6px;letter-spacing:.04em;text-transform:uppercase}
.bl{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:var(--t-sm)}
.bl:last-child{border-bottom:none}
.blt{width:92px;flex:none;font-family:var(--mono);font-size:var(--t-xs);color:var(--faint);padding-top:3px;font-variant-numeric:tabular-nums}
.blm{flex:1;min-width:0}
.blh{font-weight:600}
.bli{color:var(--mut);line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ── Home ── */
.hero{margin-bottom:22px}
.hgreet{font-size:var(--t-lg);font-weight:600;letter-spacing:-.02em}
.hsub{font-size:var(--t-sm);color:var(--mut);margin-top:3px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 22px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.tile .k{font-family:var(--mono);font-size:var(--t-xs);color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.tile .v{font-size:var(--t-xl);font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:5px;font-variant-numeric:tabular-nums}
.tile .n{font-size:var(--t-xs);color:var(--mut);margin-top:3px;font-family:var(--mono)}
.sec{font-family:var(--mono);font-size:var(--t-xs);color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin:24px 0 10px}
/* Day shape: one column per hour, height = minutes present, fill = the hour's top app. */
.shape{display:flex;align-items:flex-end;gap:3px;height:88px;padding:10px 12px 0;
  background:var(--card);border:1px solid var(--line);border-radius:12px}
.hr{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:default}
.hr i{display:block;border-radius:4px 4px 0 0;min-height:2px;transition:opacity .12s}
.hr:hover i{opacity:.7}
.hraxis{display:flex;gap:3px;padding:5px 12px 0;font-family:var(--mono);font-size:var(--t-xs);color:var(--faint)}
.hraxis span{flex:1;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:11px;margin-top:10px;font-family:var(--mono);font-size:var(--t-xs);color:var(--mut)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.ins{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.in{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;font-size:var(--t-sm);line-height:1.5}
.in .em{font-size:var(--t-sm);line-height:1.2;flex:none;opacity:.85}
.in b{font-weight:600}
.in.warn{border-color:color-mix(in oklab,var(--s2) 40%,var(--line))}
.in.good{border-color:color-mix(in oklab,var(--s3) 40%,var(--line))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.brow{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:var(--t-sm)}
.bname{width:132px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{flex:1;height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.btrack i{display:block;height:100%;border-radius:4px}
.bval{width:76px;text-align:right;font-family:var(--mono);font-size:var(--t-xs);color:var(--mut);font-variant-numeric:tabular-nums}
.week{display:flex;align-items:flex-end;gap:6px;height:56px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.wd i{width:100%;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px;opacity:.85}
.wd.today i{background:var(--s1);opacity:1}
.wd span{font-family:var(--mono);font-size:var(--t-xs);color:var(--faint)}
footer{margin-top:26px;font-family:var(--mono);font-size:var(--t-xs);color:var(--faint);line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>myday <span>— what you did</span></h1>
    <select id="date"></select>
  </header>
  <div class="bar" id="bar"></div>
  <div id="warn"></div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-v="home">Home</button>
    <button class="tab" data-v="memories">Memories</button>
    <button class="tab" data-v="apps">Apps</button>
    <button class="tab" data-v="browse">Browse</button>
    <button class="tab" data-v="sessions">Sessions</button>
  </div>
  <input id="q" type="search" placeholder="Filter this day — an app, a page, a word…" autocomplete="off">
  <div id="list"></div>
  <div id="pane"></div>
  <footer>
    Everything here is a plain Markdown file under <code>~/.myday/memories/</code>.<br>
    Delete one with the ×, or delete the file. Nothing is uploaded.
  </footer>
</div>
<script>
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md  = s => esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
let D = null, open = new Set();

async function load(date){
  const r = await fetch('/api/day' + (date ? '?date='+date : ''));
  D = await r.json();

  const sel = document.getElementById('date');
  if (sel.options.length !== (D.dates||[]).length) {
    sel.innerHTML = (D.dates||[D.date]).map(d=>`<option${d===D.date?' selected':''}>${d}</option>`).join('');
  }
  sel.value = D.date;

  const active = Math.round(D.entries.reduce((a,e)=>a+(e.activeSec||0),0)/60);
  document.getElementById('bar').innerHTML =
    `<span class="pill"><b>${D.entries.length}</b> memories</span>`+
    `<span class="pill"><b>${active}m</b> active</span>`+
    `<span class="pill"><b>${D.capture.samples}</b> samples</span>`+
    `<span class="pill">${D.paused?'paused':'recording'}</span>`+
    `<span class="pill">${esc(D.summarizer)}</span>`;

  const w = [];
  if (D.capture.samples > 40 && D.capture.titlePct === 0)
    w.push('Window titles are not being captured — app names and page titles only. <code>myday build-helper</code> then grant that one binary Accessibility.');
  if (D.summarizer === 'local' && D.entries.length)
    w.push('Summaries are local digests. <code>myday config summarizer claude-cli</code> writes them with a model instead.');
  document.getElementById('warn').innerHTML = w.map(x=>`<div class="warn">${x}</div>`).join('');

  renderPane();
}

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = D.entries.filter(e => !q ||
    `${e.title} ${e.summary} ${e.body} ${e.apps.join(' ')} ${e.sites.join(' ')} ${e.project||''}`.toLowerCase().includes(q));
  const el = document.getElementById('list');
  if (!list.length){
    el.innerHTML = `<div class="none">${q ? 'Nothing on this day matches \u201c'+esc(q)+'\u201d.'
      : 'No notes for this day.<br>My Day writes one every ten minutes while you work.'}</div>`;
    return;
  }
  const t12 = hhmm => {
    const [h,m] = hhmm.split(':').map(Number);
    return `${h%12===0?12:h%12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`;
  };
  const now = new Date();
  const nowSlot = now.getHours()*60 + Math.floor(now.getMinutes()/10)*10;

  el.innerHTML = list.map(e=>{
    const k = e.date+e.slot, o = open.has(k);
    const [hh,mm] = e.start.split(':').map(Number);
    const live = e.date === D.date && (hh*60+mm) === nowSlot;
    // Icons for apps. Sites and project stay as text: a favicon would need a network
    // request, and this page never makes one.
    const icons = e.apps.slice(0,5).map(a =>
      `<img src="/api/icon/${encodeURIComponent(a)}" alt="${esc(a)}" title="${esc(a)}" loading="lazy"
            onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'site',textContent:${JSON.stringify(a)}}))">`).join('');
    const sites = e.sites.slice(0,3).map(x=>`<span class="site">${esc(x)}</span>`).join('');
    const proj  = e.project ? `<span class="site">${esc(e.project)}</span>` : '';
    return `<div class="e ${live?'now':''}">
      <div class="etime">${t12(e.start)}</div>
      <div class="erail"><span class="edot"></span></div>
      <div class="emain">
        <div class="eti" data-k="${k}">${esc(e.title)}</div>
        ${e.summary?`<div class="esu">${esc(e.summary)}</div>`:''}
        ${(icons||sites||proj)?`<div class="eicons">${icons}${sites}${proj}</div>`:''}
        ${o?`<div class="ebody">${md(e.body)}</div>`:''}
      </div>
      <button class="x" data-d="${e.date}" data-s="${e.slot}" title="forget this">×</button>
    </div>`;
  }).join('');

  el.querySelectorAll('.eti').forEach(t=>t.onclick=()=>{
    const k=t.dataset.k; open.has(k)?open.delete(k):open.add(k); render();
  });
  el.querySelectorAll('.x').forEach(b=>b.onclick=async()=>{
    await fetch('/api/delete',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({date:b.dataset.d,slot:b.dataset.s})});
    load(D.date);
  });
}

let view = 'home';
const rows = items => items.map(i =>
  `<div class="row"><span class="rname" title="${esc(i.name)}">${esc(i.name)}</span>`+
  `<span class="rbar"><i style="width:${i.pct}%"></i></span><span class="rval">${esc(i.val)}</span></div>`).join('');

// Colour follows the app, not its rank. Slots are handed out by sorted name across the
// day's set, so re-sorting the bars or filtering the list never repaints a series, and no
// two visible apps can land on the same hue. Hashing the name was the first attempt and it
// collided immediately — Teams and Terminal came out the same pink.
// Eight fixed hues, never cycled: a ninth app gets neutral rather than an invented colour.
const SERIES = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
let _slots = new Map();
function assignHues(names){
  _slots = new Map();
  [...new Set(names)].sort().forEach((n, i) => {
    _slots.set(n, i < SERIES.length ? `var(${SERIES[i]})` : 'var(--faint)');
  });
}
const hue = (name) => _slots.get(name) || 'var(--faint)';
const durm = s => s>=3600 ? `${Math.floor(s/3600)}h ${String(Math.round(s%3600/60)).padStart(2,'0')}m` : `${Math.round(s/60)}m`;
const bold = s => esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
const ICON = {target:'◎',shuffle:'⇄',clock:'◷',sun:'☀',chart:'▤',code:'⌘',globe:'◍',span:'⟷'};

async function renderPane(){
  const list = document.getElementById('list'), pane = document.getElementById('pane'), q = document.getElementById('q');
  list.style.display = view==='memories' ? '' : 'none';
  q.style.display = view==='memories' ? '' : 'none';
  pane.style.display = view==='memories' ? 'none' : '';
  if (view==='memories') return render();

  pane.innerHTML = '<div class="none">loading…</div>';
  const d = await (await fetch(`/api/${view}?date=${D.date}`)).json();

  if (view==='home'){
    if (!d.stats || !d.stats.activeSec) return pane.innerHTML =
      '<div class="none">Nothing recorded for this day yet.<br>My Day writes its first note within ten minutes of you working.</div>';
    const st = d.stats;
    // Fix the colour assignment once for the whole view, from every app the day contains.
    assignHues([...(d.apps||[]).map(a=>a.app), ...d.hours.map(x=>x.top && x.top[0]).filter(Boolean)]);
    const hh = new Date().getHours();
    const greet = hh<12 ? 'Good morning' : hh<18 ? 'Good afternoon' : 'Good evening';
    const maxHour = Math.max(...d.hours.map(x=>x.secs), 1);
    const apps = d.apps || [];
    const maxApp = Math.max(...apps.map(a=>a.secs), 1);
    const maxWeek = Math.max(...(d.weekDays||[]).map(w=>w.secs), 1);
    const dayName = iso => ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(iso+'T12:00:00').getDay()];

    pane.innerHTML =
      `<div class="hero"><div class="hgreet">${greet}</div>`+
      `<div class="hsub">${st.first? st.first.slice(11,16):'—'} to ${st.last? st.last.slice(11,16):'—'} · `+
      `${d.insights.length} thing${d.insights.length===1?'':'s'} worth noticing</div></div>`+

      `<div class="tiles">`+
        tile('at the machine', durm(st.activeSec), st.avgActiveSec? `usual ${durm(st.avgActiveSec)}`:'')+
        tile('longest stretch', durm(st.longestSec), st.longestApp||'')+
        tile('app switches', String(st.switches), `${st.switchesPerHour}/hr`)+
        tile('notes written', String(st.notes), st.notes? 'searchable':'none yet')+
      `</div>`+

      `<div class="sec">the shape of your day</div>`+
      `<div class="shape">`+ d.hours.map(x=>{
        const pct = Math.round(x.secs/maxHour*100);
        const app = x.top? x.top[0] : null;
        const t = x.secs? `${String(x.h).padStart(2,'0')}:00 — ${Math.round(x.secs/60)}m${app?' · '+app:''}` : `${String(x.h).padStart(2,'0')}:00 — away`;
        return `<span class="hr" title="${esc(t)}"><i style="height:${pct}%;background:${app?hue(app):'var(--grid)'}"></i></span>`;
      }).join('') + `</div>`+
      `<div class="hraxis">`+ d.hours.map(x=> x.h%6===0? `<span>${String(x.h).padStart(2,'0')}</span>` : '<span></span>').join('') +`</div>`+
      `<div class="legend">`+ apps.slice(0,6).map(a=>`<span><i style="background:${hue(a.app)}"></i>${esc(a.app)}</span>`).join('') +`</div>`+

      (d.insights.length? `<div class="sec">what stands out</div><div class="ins">`+
        d.insights.map(i=>`<div class="in ${i.kind==='warn'?'warn':i.kind==='good'?'good':''}">`+
          `<span class="em">${ICON[i.icon]||'•'}</span><span>${bold(i.text)}</span></div>`).join('')+`</div>` : '')+

      `<div class="two">`+
        `<div><div class="sec">where the time went</div>`+
          apps.map(a=>`<div class="brow"><span class="bname" title="${esc(a.app)}">${esc(a.app)}</span>`+
            `<span class="btrack"><i style="width:${Math.round(a.secs/maxApp*100)}%;background:${hue(a.app)}"></i></span>`+
            `<span class="bval">${durm(a.secs)} · ${a.pct}%</span></div>`).join('')+
        `</div>`+
        `<div><div class="sec">what you read</div>`+
          ((d.sites||[]).length? d.sites.map(h=>`<div class="brow"><span class="bname" title="${esc(h.host)}">${esc(h.host)}</span>`+
            `<span class="btrack"><i style="width:${Math.round(h.visits/Math.max(...d.sites.map(x=>x.visits),1)*100)}%;background:var(--accent)"></i></span>`+
            `<span class="bval">${h.visits}</span></div>`).join('') : '<div class="bval" style="text-align:left">no browsing recorded</div>')+
          ((d.projects||[]).length? `<div class="sec">what you built</div>`+
            d.projects.map(p=>`<div class="brow"><span class="bname">${esc(p.project)}</span>`+
              `<span class="btrack"><i style="width:${Math.round(p.mins/Math.max(...d.projects.map(x=>x.mins),1)*100)}%;background:var(--s7)"></i></span>`+
              `<span class="bval">${p.mins}m</span></div>`).join('') : '')+
        `</div>`+
      `</div>`+

      `<div class="sec">last seven days</div><div class="week">`+
        (d.weekDays||[]).map(w=>`<div class="wd ${w.date===d.date?'today':''}" title="${w.date} · ${durm(w.secs)}">`+
          `<i style="height:${Math.round(w.secs/maxWeek*100)}%"></i><span>${dayName(w.date)}</span></div>`).join('')+
      `</div>`;
  }

  if (view==='apps'){
    if (!d.apps || !d.apps.length) return pane.innerHTML =
      '<div class="none">No samples for this day.<br>The daemon records these — run <code>myday status</code>.</div>';
    pane.innerHTML =
      `<div class="bar"><span class="pill"><b>${durm(d.active)}</b> at the machine</span>`+
      `<span class="pill"><b>${d.apps.length}</b> apps</span>`+
      `<span class="pill"><b>${d.switches}</b> switches · ${d.switchesPerHour}/hr</span>`+
      (d.longest?`<span class="pill">longest <b>${durm(d.longest.secs)}</b> ${esc(d.longest.app)}</span>`:'')+`</div>`+
      `<div class="sub">today</div>`+
      rows(d.apps.map(a=>({name:a.app, pct:a.pct, val:`${durm(a.secs)} · ${a.pct}%`})))+
      `<div class="sub">last 7 days</div>`+
      rows(d.weekApps.map(a=>({name:a.app, pct:Math.round(a.secs/Math.max(...d.weekApps.map(x=>x.secs),1)*100), val:durm(a.secs)})));
  }

  if (view==='browse'){
    if (!d.blocks || !d.blocks.length) return pane.innerHTML = '<div class="none">No browsing recorded for this day.</div>';
    pane.innerHTML =
      `<div class="bar"><span class="pill"><b>${d.visits}</b> visits</span><span class="pill"><b>${d.hosts.length}</b> sites</span></div>`+
      d.blocks.map(b=>`<div class="bl"><div class="blt">${b.start}${b.end?'<br>'+b.end:''}</div><div class="blm">`+
        `<div class="blh">${esc(b.host)}${b.count>1?` <span style="color:var(--faint);font-weight:400">×${b.count}</span>`:''}</div>`+
        b.titles.slice(0,3).map(t=>`<div class="bli">${esc(t)}</div>`).join('')+`</div></div>`).join('');
  }

  if (view==='sessions'){
    if (!d.available) return pane.innerHTML =
      '<div class="none">No Claude Code transcripts found.<br>This view is for Claude Code users.</div>';
    if (!d.sessions.length) return pane.innerHTML = '<div class="none">No sessions on this day.</div>';
    pane.innerHTML =
      `<div class="bar"><span class="pill"><b>${d.sessions.length}</b> sessions</span>`+
      `<span class="pill"><b>${durm(d.totalMins*60)}</b> elapsed</span>`+
      d.projects.slice(0,4).map(p=>`<span class="pill">${esc(p.project)} <b>${p.mins}m</b></span>`).join('')+`</div>`+
      d.sessions.map(s=>`<div class="bl"><div class="blt">${s.start}<br>${s.end}</div><div class="blm">`+
        `<div class="blh">${esc(s.project)} <span style="color:var(--faint);font-weight:400">${s.mins}m · ${s.turns} turns</span></div>`+
        `<div class="bli">${esc(s.prompt)}</div></div></div>`).join('');
  }
}

function tile(k,v,n){ return `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="n">${esc(n)}</div></div>`; }

document.getElementById('tabs').onclick = e => {
  const b = e.target.closest('.tab'); if (!b) return;
  view = b.dataset.v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t===b));
  renderPane();
};
document.getElementById('q').oninput = () => render();
document.getElementById('date').onchange = e => load(e.target.value);
load();
</script>
</body>
</html>
