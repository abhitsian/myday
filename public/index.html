<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Day</title>
<style>
/* ============================================================================
   My Day — the day's own light.

   The one image in this app is not decoration: it is the axis. The day-shape
   chart already runs 00→24 across the x, so the sky behind it is painted with
   the actual light of those hours — night at both ends, dawn at six, open sky
   at noon, dusk at seven. The hour bars stand against it as a ridgeline, which
   is the same figure as the app icon.

   Everything else stays quiet on purpose. This is a surface you read to answer
   a question, so scanning beats expression everywhere outside that one band.
   ============================================================================ */
:root{
  --bg:#faf9f6; --card:#fffefc; --sunk:#f2f0ea;
  --ink:#16150f; --mut:#5f5b50; --faint:#96917f; --line:#e6e2d6;
  --accent:#4f6285; --warn:#a4661d;

  /* The sky, in the order the day happens. Also the icon's palette. */
  --sky-night:#232a4d; --sky-dawn:#8d7fa6; --sky-amber:#f0a868;
  --sky-noon:#bcd0e4; --sky-dusk:#e88a5c; --sky-late:#2c2f52;
  --ridge:#2b2f4f;

  /* Validated categorical set — CVD and contrast checked in both modes. */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --grid:rgba(20,18,10,.07);

  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --num:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;

  --t-xs:11.5px; --t-sm:14px; --t-md:17.5px; --t-lg:22px; --t-xl:40px;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#131316; --card:#1b1b1f; --sunk:#202027;
    --ink:#f0eee9; --mut:#a09c93; --faint:#6f6b64; --line:#2b2b32;
    --accent:#93a9cd; --warn:#d9a45c;
    --ridge:#0e1024;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --grid:rgba(255,255,255,.08);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;font-size:var(--t-sm);line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:26px 26px 90px}

/* ── masthead ───────────────────────────────────────────────────────────── */
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:var(--t-lg);font-weight:650;margin:0;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--faint);font-weight:400}
select,input,button{font-family:inherit;font-size:var(--t-sm);color:var(--ink)}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.state{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:var(--t-xs);color:var(--mut)}
.pip{width:7px;height:7px;border-radius:50%;background:var(--s3);box-shadow:0 0 0 3px color-mix(in oklab,var(--s3) 22%,transparent)}
.pip.off{background:var(--faint);box-shadow:none}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--mut);
  padding:9px 13px;cursor:pointer;margin-bottom:-1px;border-radius:7px 7px 0 0}
.tab:hover{color:var(--ink);background:var(--sunk)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

.warn{background:color-mix(in oklab,var(--warn) 9%,var(--card));
  border:1px solid color-mix(in oklab,var(--warn) 26%,var(--line));
  color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:var(--t-xs);
  line-height:1.65;margin-bottom:16px}
.warn code{background:color-mix(in oklab,var(--warn) 14%,transparent);padding:1px 5px;border-radius:4px}

/* ── the sky: the only image, and it is the x-axis ──────────────────────── */
.sky{position:relative;height:190px;border-radius:var(--r);overflow:hidden;
  /* 90deg, and every stop is an actual hour: x is time of day, so the sky has to agree
     with the axis underneath it. 5am 21%, 6:30 27%, noon 50%, 6pm 75%, 8pm 83%. An angled
     gradient put dawn light an hour off from the 06 label. */
  background:linear-gradient(90deg,
    var(--sky-night) 0%,  var(--sky-night) 17%, var(--sky-dawn) 21%,
    var(--sky-amber) 27%, var(--sky-noon)  50%, var(--sky-noon) 62%,
    var(--sky-dusk)  75%, var(--sky-late)  83%, var(--sky-late) 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sun{position:absolute;width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle at 50% 40%, #fffdf2 0%, #ffe9a8 38%, #f9bf6a 72%, #f0a352 100%);
  filter:drop-shadow(0 0 46px rgba(255,214,142,.85));bottom:52px;transform:translateX(-50%)}
/* The ridge. Bars are the silhouette, so the chart and the picture are one thing. */
/* All four insets rather than height:100%. WebKit resolved the percentage height of this
   absolutely-positioned box against nothing and collapsed the ridge to a few pixels, so the
   bars rendered as stubs in the app while Chrome drew them correctly. */
.ridge{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px;padding:0 3px}
.hr{flex:1;display:flex;align-items:flex-end;height:100%;cursor:default}
.hr i{display:block;width:100%;background:var(--ridge);border-radius:3px 3px 0 0;
  transform-origin:bottom;animation:rise .7s cubic-bezier(.16,1,.3,1) both}
.hr:hover i{filter:brightness(1.35)}
@keyframes rise{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){ .hr i{animation:none} }
.axis{display:flex;padding:7px 3px 0;font-family:var(--num);font-size:var(--t-xs);color:var(--faint)}
.axis span{flex:1;text-align:center}

/* ── the headline reads as a sentence, not a row of tiles ───────────────── */
.lede{font-size:var(--t-md);line-height:1.62;letter-spacing:-.01em;margin:22px 0 4px;max-width:64ch}
.lede b{font-weight:650;font-variant-numeric:tabular-nums}
.lede .big{font-size:var(--t-xl);font-weight:650;letter-spacing:-.03em;line-height:1;
  display:inline-block;vertical-align:-3px;margin-right:2px}
.lede .q{color:var(--mut)}
.span{font-family:var(--num);font-size:var(--t-xs);color:var(--faint);margin-bottom:26px}

h2{font-size:var(--t-sm);font-weight:650;margin:30px 0 11px;letter-spacing:-.005em}
h2 span{font-weight:400;color:var(--faint)}

/* ── insights: a list with hairlines, not a grid of cards ───────────────── */
.ins{border-top:1px solid var(--line)}
.in{display:flex;gap:12px;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line)}
.in .g{width:17px;flex:none;color:var(--mut);font-size:var(--t-sm);line-height:1.4}
.in p{margin:0;line-height:1.55}
.in b{font-weight:650;font-variant-numeric:tabular-nums}
.in.warn2 .g{color:var(--s2)}
.in.good .g{color:var(--s3)}

/* ── measured rows: app icon, name, bar, value ──────────────────────────── */
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px}
@media(max-width:720px){.two{grid-template-columns:1fr;gap:8px}}
.row{display:flex;align-items:center;gap:9px;padding:6px 0}
.row img{width:17px;height:17px;border-radius:4px;flex:none;object-fit:contain}
.row .nm{width:118px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.wide .nm{width:150px}
.row .tr{flex:1;height:7px;background:var(--grid);border-radius:4px;overflow:hidden}
.row .tr i{display:block;height:100%;border-radius:4px}
.row .vl{width:104px;flex:none;text-align:right;font-family:var(--num);font-size:var(--t-xs);
  color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:3px;flex:none}

.week{display:flex;align-items:flex-end;gap:7px;height:76px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wd i{width:100%;border-radius:4px 4px 0 0;min-height:3px;
  background:color-mix(in oklab,var(--accent) 58%,transparent);transition:background .12s}
.wd.today i{background:var(--accent)}
.wd:hover i{background:color-mix(in oklab,var(--accent) 80%,transparent)}
.wd span{font-family:var(--num);font-size:var(--t-xs);color:var(--faint)}

/* ── timeline ───────────────────────────────────────────────────────────── */
#q{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 13px;outline:none;margin-bottom:8px}
#q:focus{border-color:var(--mut)}
.e{display:flex;position:relative}
.etime{width:76px;flex:none;text-align:right;padding:14px 14px 0 0;font-family:var(--num);
  font-size:var(--t-xs);color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.erail{width:17px;flex:none;position:relative}
.erail::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--line)}
.e:first-child .erail::before{top:20px}
.e:last-child .erail::before{bottom:auto;height:20px}
.edot{position:absolute;left:4px;top:20px;width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:2px solid var(--line);z-index:1}
.e.now .edot{border-color:var(--accent);background:var(--accent)}
.emain{flex:1;min-width:0;padding:13px 0 18px 12px}
.eti{font-size:var(--t-md);font-weight:600;letter-spacing:-.01em;cursor:pointer;line-height:1.32}
.eti:hover{color:var(--accent)}
.esu{color:var(--mut);line-height:1.55;margin-top:4px}
.eicons{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.eicons img{width:19px;height:19px;border-radius:4px;object-fit:contain}
.chip{font-family:var(--num);font-size:var(--t-xs);color:var(--mut);
  background:var(--sunk);border-radius:5px;padding:2px 7px}
.ebody{margin-top:10px;padding:11px 13px;background:var(--sunk);border-radius:10px;
  color:var(--mut);line-height:1.7;white-space:pre-wrap}
.x{flex:none;align-self:flex-start;margin-top:14px;background:none;border:none;color:var(--faint);
  font-size:var(--t-md);line-height:1;cursor:pointer;padding:2px 5px;opacity:0}
.e:hover .x{opacity:1}
.x:hover{color:var(--s8)}

/* ── Apps: a stacked week. The question is "what is my mix", so the form has to show
      composition changing, not seven totals. 2px gaps keep segments legible. ────────── */
.stackwrap{display:flex;align-items:flex-end;gap:10px;height:230px;margin-top:6px}
.stackday{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:6px}
.stackcol{display:flex;flex-direction:column-reverse;gap:2px;border-radius:5px;overflow:hidden}
.stackcol i{display:block;min-height:2px;transition:filter .12s}
.stackcol:hover i{filter:brightness(1.12)}
.stacklab{text-align:center;font-family:var(--num);font-size:var(--t-xs);color:var(--faint);line-height:1.35}
.stacklab b{display:block;color:var(--mut);font-weight:500}
.stackday.today .stacklab b{color:var(--ink);font-weight:650}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px}
.legend span{display:flex;align-items:center;gap:6px;font-size:var(--t-xs);color:var(--mut)}
.legend i{width:9px;height:9px;border-radius:3px}
/* Today's mix as one bar, so share reads directly rather than by comparing seven columns. */
.share{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px;margin-top:6px}
.share i{display:block;position:relative}
.share i span{position:absolute;inset:0;display:grid;place-items:center;font-size:var(--t-xs);
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden}

/* ── Building: sessions are spans, so they get a position on the day, not a list row.
      Overlap is the point — several terminals at once is the actual shape. ─────────── */
.gantt{position:relative;margin-top:6px;padding:4px 0;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.gtick{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.grow{position:relative;height:30px;display:flex;align-items:center}
.gbar{position:absolute;height:19px;border-radius:5px;background:var(--s7);display:flex;align-items:center;
  padding:0 7px;overflow:hidden;min-width:4px}
.gbar b{font-size:var(--t-xs);font-weight:600;color:#fff;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.glabel{position:absolute;left:0;right:0;font-size:var(--t-xs);color:var(--mut);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.gaxis{position:relative;height:16px;margin-top:6px;font-family:var(--num);font-size:var(--t-xs);color:var(--faint)}
.gaxis span{transform:translateX(-50%)}

/* ── Reading: this is content, not measurement. It should read like a reading list. ── */
.rgroup{margin-bottom:26px}
.rhost{display:flex;align-items:baseline;gap:9px;margin-bottom:7px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.rhost b{font-size:var(--t-md);font-weight:650;letter-spacing:-.01em}
.rhost span{font-family:var(--num);font-size:var(--t-xs);color:var(--faint)}
.rhost .when{margin-left:auto}
.rart{display:flex;gap:11px;align-items:baseline;padding:5px 0}
.rart .rt{flex:1;min-width:0;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* A reading list should not shout in link blue, but a title with no affordance at all
   reads as plain text. A hairline underline says clickable and stays out of the way. */
.rart a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);
  text-decoration-thickness:1px;text-underline-offset:3px}
.rart a:hover{color:var(--accent);text-decoration-color:var(--accent)}
.rart a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.rart .rc{font-family:var(--num);font-size:var(--t-xs);color:var(--faint);flex:none}

/* ── Permissions: the switches, next to the thing they switch. ─────────────────────── */
.pgroup{padding:18px 0;border-bottom:1px solid var(--line)}
.pgroup:last-of-type{border-bottom:none}
.phead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.phead h2{margin:0}
.pmode{display:flex;gap:2px;background:var(--sunk);border-radius:8px;padding:2px}
.pmode button{background:none;border:none;border-radius:6px;padding:5px 11px;
  font-size:var(--t-xs);color:var(--mut);cursor:pointer}
.pmode button.on{background:var(--card);color:var(--ink);font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pnote{color:var(--faint);font-size:var(--t-xs);margin:2px 0 12px;line-height:1.6}
.rules{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.rule{display:inline-flex;align-items:center;gap:7px;background:var(--sunk);
  border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-family:var(--num);font-size:var(--t-xs)}
.rule button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px;line-height:1;padding:0}
.rule button:hover{color:var(--s8)}
.addrule{display:flex;gap:7px}
.addrule input{flex:1;max-width:320px;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:7px 11px;font-family:var(--num);font-size:var(--t-xs);color:var(--ink);outline:none}
.addrule input:focus{border-color:var(--mut)}
.addrule button{background:var(--sunk);border:1px solid var(--line);border-radius:8px;
  padding:7px 13px;font-size:var(--t-xs);color:var(--ink);cursor:pointer}
.addrule button:hover{border-color:var(--mut)}
.empty-allow{color:var(--warn);font-size:var(--t-xs);margin-bottom:10px}
.clearbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.clearbar button{background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:7px 13px;font-size:var(--t-xs);color:var(--ink);cursor:pointer}
.clearbar button:hover{border-color:var(--s8);color:var(--s8)}
.clearbar button.danger{color:var(--s8)}
.clearbar button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.srow{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow.off{opacity:.5}
.srow .pnote{margin:1px 0 0}
.reon{margin-top:10px;font:inherit;font-size:var(--t-xs);padding:6px 14px;border-radius:999px;
  border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.srow>div:first-child{max-width:70ch}
.sname{font-size:var(--t-sm);font-weight:600;margin-bottom:2px}
.pnote.dim{opacity:.62}
.salways{font-size:var(--t-xs);color:var(--faint);white-space:nowrap;padding-top:3px}
.stog{flex:none;min-width:52px;font:inherit;font-size:var(--t-xs);padding:5px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer}
.stog.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}

/* ── Threads: the work, not the software. State is the reason to look, so it leads. ── */
.thread{display:grid;grid-template-columns:76px 1fr;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}
.tstate{font-family:var(--num);font-size:var(--t-xs);padding-top:3px}
.tstate .pill{display:inline-block;padding:2px 7px;border-radius:5px;white-space:nowrap}
.tstate .today{background:color-mix(in oklab,var(--s3) 18%,transparent);color:var(--s3)}
.tstate .active{background:color-mix(in oklab,var(--s1) 16%,transparent);color:var(--s1)}
.tstate .warm{background:color-mix(in oklab,var(--s4) 20%,transparent);color:var(--warn)}
.tstate .quiet{background:color-mix(in oklab,var(--s2) 16%,transparent);color:var(--s2)}
.tname{font-size:var(--t-md);font-weight:650;letter-spacing:-.01em}
.tnew{font-family:var(--num);font-size:var(--t-xs);color:var(--faint);font-weight:400;margin-left:8px}
.tmeta{font-family:var(--num);font-size:var(--t-xs);color:var(--mut);margin-top:4px}
.tsum{color:var(--mut);margin-top:6px;line-height:1.55}
/* One cell per day in range: the run of a thread is the thing you cannot see in a list. */
.trun{display:flex;gap:2px;margin-top:9px}
.trun i{width:9px;height:9px;border-radius:2px;background:var(--grid)}
.trun i.on{background:var(--accent)}
.loops{background:var(--sunk);border-radius:var(--r);padding:14px 16px;margin-bottom:22px}
.loops h3{margin:0 0 8px;font-size:var(--t-sm);font-weight:650}
.loops div{color:var(--mut);padding:3px 0}
.loops b{color:var(--ink);font-weight:600}

/* ── Friction: an audit, so each row carries its cost as a bar you can rank by eye. ── */
.fitem{display:grid;grid-template-columns:1fr 128px;gap:16px;align-items:start;
  padding:14px 0;border-bottom:1px solid var(--line)}
.fitem .ft{font-weight:650}
.fitem .fd{color:var(--mut);margin-top:2px}
.fitem .ff{margin-top:7px;line-height:1.55;color:var(--mut)}
.fitem .ff em{font-style:normal;font-family:var(--num);font-size:var(--t-xs);
  color:var(--faint);margin-right:7px;letter-spacing:.05em}
.fcost{text-align:right}
.fcost .n{font-family:var(--num);font-size:var(--t-md);font-weight:650;font-variant-numeric:tabular-nums}
.fcost .u{font-family:var(--num);font-size:var(--t-xs);color:var(--faint)}
.fcost .tr{height:6px;background:var(--grid);border-radius:3px;margin-top:6px;overflow:hidden}
.fcost .tr i{display:block;height:100%;background:var(--s2);border-radius:3px}
@media(max-width:640px){.fitem{grid-template-columns:1fr}.fcost{text-align:left}}

/* A session is a different kind of event from a note: it has an id you can return to. */
.e.sess .edot{border-color:var(--s7);background:var(--bg)}
.e.sess .emain{border-left:2px solid color-mix(in oklab,var(--s7) 35%,transparent);
  padding-left:12px;margin-left:-2px}
.sesshead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sesstag{font-family:var(--num);font-size:var(--t-xs);color:var(--s7);
  background:color-mix(in oklab,var(--s7) 12%,transparent);border-radius:5px;padding:2px 7px}
.sessmeta{font-family:var(--num);font-size:var(--t-xs);color:var(--faint)}
.resume{display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:6px 10px;
  background:var(--sunk);border:1px solid var(--line);border-radius:8px;
  font-family:var(--num);font-size:var(--t-xs);color:var(--mut);cursor:pointer}
.resume:hover{border-color:var(--s7);color:var(--ink)}
.resume b{font-weight:500;color:var(--ink)}

/* ── browse / sessions ──────────────────────────────────────────────────── */
.bl{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.bl:last-child{border-bottom:none}
.blt{width:76px;flex:none;font-family:var(--num);font-size:var(--t-xs);color:var(--faint);
  padding-top:3px;font-variant-numeric:tabular-nums}
.blm{flex:1;min-width:0}
.blh{font-weight:600}
.bli{color:var(--mut);line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── friction ───────────────────────────────────────────────────────────── */
.fh{margin-bottom:8px}
.fh .v{font-size:var(--t-xl);font-weight:650;letter-spacing:-.03em;line-height:1.05;
  font-variant-numeric:tabular-nums}
.fh .n{color:var(--mut);margin-top:6px}
.fh .c{font-family:var(--num);font-size:var(--t-xs);color:var(--faint);margin-top:8px}
.f{padding:13px 0;border-bottom:1px solid var(--line)}
.f .ft{font-weight:650}
.f .fd{color:var(--mut);margin-top:3px}
.f .ff{margin-top:7px;line-height:1.55}
.f .ff em{font-style:normal;font-family:var(--num);font-size:var(--t-xs);color:var(--faint);
  margin-right:7px;letter-spacing:.05em}

.none{color:var(--faint);background:var(--card);border:1px dashed var(--line);
  border-radius:var(--r);padding:30px;text-align:center;line-height:1.9}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  font-size:var(--t-xs);color:var(--faint);line-height:1.8}
/* People + Content */
.pcold{margin:0 0 22px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.pcold h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);font-weight:640;display:flex;align-items:center;gap:7px}
.pcold h3::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.pcoldrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pchip{font:inherit;font-size:13px;padding:7px 11px;background:var(--sunk);border:0;border-radius:9px;cursor:pointer}
.pchip b{font-weight:600}.pchip span{font-family:var(--num);font-size:12px;color:var(--faint)}
.ptable{width:100%;border-collapse:collapse;margin-top:6px}
.ptable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600;padding:0 10px 9px;border-bottom:1px solid var(--line)}
.ptable td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptable tr{cursor:pointer}.ptable tbody tr:hover td{background:var(--card)}
.pnm{font-weight:600}.pch{font-size:12.5px;color:var(--mut)}.pn{font-family:var(--num);font-size:13px;color:var(--mut);text-align:right;width:38px}
.plast{font-family:var(--num);font-size:12px;color:var(--faint)}
.pspark{display:inline-flex;gap:2px;align-items:flex-end}
.pspark i{width:4px;background:var(--accent);border-radius:1.5px;opacity:.8;min-height:2px}
.ptr{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.ptr.rising{color:#2f6b3d;background:#e6f1e8}.ptr.fading{color:#8a5a12;background:#f6ecdb}
.ptr.steady{color:var(--mut);background:var(--sunk)}.ptr.cold{color:var(--warn);background:#f6e6d6}
.ptopic{color:var(--mut);font-size:13px;max-width:30ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pscrim{position:fixed;inset:0;background:rgba(20,18,12,.28);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
#pscrim.on{opacity:1;pointer-events:auto}
#pdrawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--bg);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .22s cubic-bezier(.16,1,.3,1);padding:32px 28px;overflow-y:auto;z-index:41}
#pdrawer.on{transform:none}
#pdrawer h3{font-size:22px;font-weight:680;letter-spacing:-.01em}
#pdrawer .pmeta{font-family:var(--num);font-size:12px;color:var(--mut);margin-top:6px}
.pdsec{margin-top:22px}.plbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;margin-bottom:9px}
.pdtopic{padding:8px 11px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px}
.pdstrip{display:flex;gap:2px;align-items:flex-end;height:40px}.pdstrip i{flex:1;background:var(--accent);border-radius:2px;opacity:.8;min-height:2px}
.pnote{color:var(--faint);font-size:12.5px;margin-top:6px}
.rdlist{margin-top:8px}
.rdrow{display:flex;gap:16px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:baseline}
.rdmin{font-family:var(--num);font-size:12.5px;color:var(--mut);width:44px;text-align:right;flex:none}
.rdtitle{font-size:14.5px;font-weight:520;line-height:1.35;color:var(--ink);text-decoration:none;display:block}
a.rdtitle:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.rdmeta{font-size:12px;color:var(--faint);margin-top:3px;display:flex;align-items:center;gap:7px}
.rdsrc{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:5px;font-weight:600}
.rdsrc.doc{background:#e6eef1;color:#3a6070}.rdsrc.web{background:var(--sunk);color:var(--mut)}.rdsrc.app{background:#efe9f2;color:#6a5580}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>My Day <em>— what you did</em></h1>
    <select id="date" aria-label="Choose a day"></select>
    <span class="state" id="state"></span>
  </div>

  <div class="tabs" id="tabs" role="tablist">
    <button class="tab on" data-v="home">Today</button>
    <button class="tab" data-v="memories">Timeline</button>
    <button class="tab" data-v="apps">Apps</button>
    <button class="tab" data-v="threads">Threads</button>
    <button class="tab" data-v="people">People</button>
    <button class="tab" data-v="reading">Content</button>
    <button class="tab" data-v="permissions">Permissions</button>
  </div>

  <div id="warn"></div>
  <input id="q" type="search" placeholder="Filter this day — an app, a page, a word…" autocomplete="off">
  <div id="list"></div>
  <div id="pane"></div>

  <footer>
    Every note here is a plain Markdown file in <code>~/.myday/memories/</code>.<br>
    Delete one with the ×, or delete the file. Nothing is uploaded.
  </footer>
</div>
<script>
const esc  = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md   = s => esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
const bold = s => esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
const durm = s => {
  // Round to whole minutes FIRST, then split. Splitting first let 2h59m30s print "2h 60m".
  const m = Math.round(s/60);
  return m >= 60 ? `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m` : `${m}m`;
};
let D = null, view = 'home', open = new Set();
const t12 = t => { const [h,m]=String(t).split(':').map(Number);
  return `${h%12===0?12:h%12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`; };

/* Eight fixed hues, never cycled, handed out in the order given. Callers pass apps ranked
   by total time over the WEEK, not by today's rank: ranking on the week keeps a colour
   attached to an app as you move between days, while still spending the eight hues on the
   apps you actually use. Alphabetical order was stable too, but it pushed Terminal and
   zoom.us past slot eight and returned them both as the same grey. */
const SERIES = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
let _slots = new Map();
function assignHues(rankedNames){
  _slots = new Map();
  [...new Set(rankedNames)].forEach((n,i)=> _slots.set(n, i<SERIES.length ? `var(${SERIES[i]})` : 'var(--faint)'));
}
const hue = n => _slots.get(n) || 'var(--faint)';
const appIcon = (a,sz) => `<img src="/api/icon/${encodeURIComponent(a)}" alt="" title="${esc(a)}" loading="lazy"
  ${sz?`style="width:${sz}px;height:${sz}px"`:''} onerror="this.style.display='none'">`;
/// An icon in the timeline is the fastest place to say "not this one, ever again" — you are
/// looking at the evidence when you decide.
async function excludeApp(app){
  if (!confirm(`Stop recording ${app}?\n\nFuture history will leave it out. What is already recorded stays until you clear it.`)) return;
  await fetch('/api/permission',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({kind:'app', value:app, on:true})});
  load(D.date);
}
const appIconClickable = (a) => `<img src="/api/icon/${encodeURIComponent(a)}" alt="${esc(a)}"
  title="${esc(a)} — click to stop recording it" loading="lazy" style="cursor:pointer"
  onclick="excludeApp(${JSON.stringify(a)})" onerror="this.style.display='none'">`;

async function load(date){
  D = await (await fetch('/api/day' + (date ? '?date='+date : ''))).json();

  const sel = document.getElementById('date');
  if (sel.options.length !== (D.dates||[]).length)
    sel.innerHTML = (D.dates||[D.date]).map(d=>`<option>${d}</option>`).join('');
  sel.value = D.date;

  document.getElementById('state').innerHTML =
    `<span class="pip ${D.paused?'off':''}"></span>${D.paused?'paused':'recording'} · ${D.entries.length} notes`;

  const w = [];
  if (D.capture.samples > 40 && D.capture.titlePct === 0)
    w.push('Window titles are off, so notes name the app but not the document. Menu bar icon → <b>Window titles off — click to allow</b>.');
  if (D.summarizer === 'local' && D.entries.length)
    w.push('Notes are plain digests right now. <code>myday config summarizer claude-cli</code> writes them as sentences.');
  document.getElementById('warn').innerHTML = w.map(x=>`<div class="warn">${x}</div>`).join('');

  renderPane();
}

/* ── Timeline ───────────────────────────────────────────────────────────── */
// Sessions arrive from a second endpoint and are merged into the same rail: the day is one
// sequence, and splitting "what I did" from "what I built" across two tabs makes you hold
// the ordering in your head.
let _sessions = [];
async function loadSessions(){
  try {
    const d = await (await fetch(`/api/sessions?date=${D.date}`)).json();
    _sessions = (d && d.available && d.sessions) ? d.sessions : [];
  } catch { _sessions = []; }
}

function copyResume(el, id){
  navigator.clipboard.writeText(`claude --resume ${id}`).then(()=>{
    const was = el.querySelector('b').textContent;
    el.querySelector('b').textContent = 'copied';
    setTimeout(()=>{ el.querySelector('b').textContent = was; }, 1400);
  }).catch(()=>{});
}

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = D.entries.filter(e => !q ||
    `${e.title} ${e.summary} ${e.body} ${e.apps.join(' ')} ${e.sites.join(' ')} ${e.project||''}`.toLowerCase().includes(q));
  const el = document.getElementById('list');
  if (!list.length){
    el.innerHTML = `<div class="none">${q ? 'Nothing on this day matches “'+esc(q)+'”.'
      : 'No notes yet for this day.<br>My Day writes one every ten minutes while you work.'}</div>`;
    return;
  }
  const now = new Date(), nowSlot = now.getHours()*60 + Math.floor(now.getMinutes()/10)*10;
  const mins = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };

  // One chronological rail: notes and sessions interleaved by start time.
  const events = [
    ...list.map(e=>({kind:'note', at:mins(e.start), e})),
    ..._sessions.filter(sn=>!q ||
        `${sn.title} ${sn.project} ${sn.prompt}`.toLowerCase().includes(q))
      .map(sn=>({kind:'sess', at:mins(sn.start), sn})),
  ].sort((a,b)=>a.at-b.at);

  el.innerHTML = events.map(ev=>{
    if (ev.kind==='sess'){
      const sn = ev.sn;
      return `<div class="e sess">
        <div class="etime">${t12(sn.start)}</div>
        <div class="erail"><span class="edot"></span></div>
        <div class="emain">
          <div class="sesshead">
            <span class="sesstag">Claude Code</span>
            <span class="sessmeta">${esc(sn.project)} · ${sn.mins}m · ${sn.turns} turns</span>
          </div>
          <div class="eti" style="cursor:default">${esc(sn.title)}</div>
          ${sn.cwd?`<div class="sessmeta" style="margin-top:4px">${esc(sn.cwd.replace(/^\/Users\/[^/]+/,'~'))}</div>`:''}
          <span class="resume" onclick="copyResume(this,'${esc(sn.sessionId)}')"
                title="Copy the command that reopens this session">↩ <b>resume</b></span>
        </div>
      </div>`;
    }
    const e = ev.e;
    return renderNote(e, nowSlot);
  }).join('');

  el.querySelectorAll('.eti[data-k]').forEach(t=>t.onclick=()=>{
    const k=t.dataset.k; open.has(k)?open.delete(k):open.add(k); render();
  });
  el.querySelectorAll('.x').forEach(b=>b.onclick=async()=>{
    await fetch('/api/delete',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({date:b.dataset.d,slot:b.dataset.s})});
    load(D.date);
  });
  return;
}

function renderNote(e, nowSlot){
  {
    const k=e.date+e.slot, o=open.has(k), [hh,mm]=e.start.split(':').map(Number);
    const live = e.date===D.date && (hh*60+mm)===nowSlot;
    const marks = e.apps.slice(0,5).map(a=>appIconClickable(a)).join('')
      + e.sites.slice(0,3).map(x=>`<span class="chip">${esc(x)}</span>`).join('')
      + (e.project?`<span class="chip">${esc(e.project)}</span>`:'');
    return `<div class="e ${live?'now':''}">
      <div class="etime">${t12(e.start)}</div>
      <div class="erail"><span class="edot"></span></div>
      <div class="emain">
        <div class="eti" data-k="${k}">${esc(e.title)}</div>
        ${e.summary?`<div class="esu">${esc(e.summary)}</div>`:''}
        ${marks?`<div class="eicons">${marks}</div>`:''}
        ${o?`<div class="ebody">${md(e.body)}</div>`:''}
      </div>
      <button class="x" data-d="${e.date}" data-s="${e.slot}" title="Forget this note" aria-label="Forget this note">×</button>
    </div>`;
  }
}

const GLYPH = {target:'◎',shuffle:'⇄',clock:'◷',sun:'☀',chart:'▤',code:'⌘',globe:'◍',span:'⟷'};
const bar = (name,pct,val,color,icon) =>
  `<div class="row${icon?'':' wide'}">${icon?appIcon(name):`<span class="dot" style="background:${color}"></span>`}`+
  `<span class="nm" title="${esc(name)}">${esc(name)}</span>`+
  `<span class="tr"><i style="width:${pct}%;background:${color}"></i></span>`+
  `<span class="vl">${esc(val)}</span></div>`;

async function renderPane(){
  const list=document.getElementById('list'), pane=document.getElementById('pane'), q=document.getElementById('q');
  list.style.display = view==='memories' ? '' : 'none';
  q.style.display    = view==='memories' ? '' : 'none';
  pane.style.display = view==='memories' ? 'none' : '';
  if (view==='memories') { await loadSessions(); return render(); }

  pane.innerHTML = '<div class="none">Reading your day…</div>';
  const d = await (await fetch(`/api/${view}?date=${D.date}`)).json();

  if (view==='home'){
    if (!d.stats || !d.stats.activeSec) return pane.innerHTML =
      '<div class="none">Nothing recorded for this day yet.<br>The first note lands within ten minutes of you working.</div>';
    const st=d.stats, apps=d.apps||[];
    assignHues([...apps.map(a=>a.app), ...d.hours.map(x=>x.top&&x.top[0]).filter(Boolean)]);   // already time-ranked
    const maxHour=Math.max(...d.hours.map(x=>x.secs),1), maxApp=Math.max(...apps.map(a=>a.secs),1);
    const maxWeek=Math.max(...(d.weekDays||[]).map(w=>w.secs),1);
    const dayName=i=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(i+'T12:00:00').getDay()];

    // The sun sits at the middle of the hours actually worked, so the picture is this day's.
    const worked = d.hours.filter(h=>h.secs>0);
    const mid = worked.length ? (worked[0].h + worked[worked.length-1].h)/2 : 12;
    const vsAvg = st.avgActiveSec ? Math.round((st.activeSec/st.avgActiveSec-1)*100) : null;

    pane.innerHTML =
      `<div class="sky">
         <span class="sun" style="left:${(mid/24*100).toFixed(1)}%"></span>
         <div class="ridge">`+
           d.hours.map((x,i)=>{
             const pct=Math.round(x.secs/maxHour*76);
             const app=x.top?x.top[0]:null;
             const t=x.secs?`${String(x.h).padStart(2,'0')}:00 — ${Math.round(x.secs/60)}m${app?' · '+app:''}`
                            :`${String(x.h).padStart(2,'0')}:00 — away`;
             return `<span class="hr" title="${esc(t)}"><i style="height:${Math.max(pct,x.secs?4:0)}%;animation-delay:${i*14}ms"></i></span>`;
           }).join('')+
         `</div>
       </div>
       <div class="axis">`+ d.hours.map(x=> x.h%6===0?`<span>${String(x.h).padStart(2,'0')}</span>`:'<span></span>').join('') +`</div>

       <p class="lede"><span class="big">${durm(st.activeSec)}</span> at the machine`+
         (vsAvg!==null ? `, <b>${vsAvg>=0?'+':''}${vsAvg}%</b> against your usual ${durm(st.avgActiveSec)}` : '')+
         `. Longest unbroken stretch <b>${durm(st.longestSec)}</b>`+
         (st.longestApp?` in ${esc(st.longestApp)}`:'')+
         `, across <b>${st.switches}</b> app switches.</p>
       <div class="span">${st.first?st.first.slice(11,16):'—'} → ${st.last?st.last.slice(11,16):'—'} · ${d.hours.filter(h=>h.secs>0).length} hours with activity</div>`+

      (d.insights.length ? `<h2>What stands out</h2><div class="ins">`+
        d.insights.map(i=>`<div class="in ${i.kind==='warn'?'warn2':i.kind==='good'?'good':''}">`+
          `<span class="g">${GLYPH[i.icon]||'•'}</span><p>${bold(i.text)}</p></div>`).join('')+`</div>` : '')+

      `<div class="two">
         <div><h2>Where the time went</h2>`+
           apps.map(a=>bar(a.app, Math.round(a.secs/maxApp*100), `${durm(a.secs)} · ${a.pct}%`, hue(a.app), true)).join('')+
         `</div>
         <div><h2>What you read</h2>`+
           ((d.sites||[]).length
             ? d.sites.map(h=>bar(h.host, Math.round(h.visits/Math.max(...d.sites.map(x=>x.visits),1)*100),
                                  `${h.visits}`, 'var(--accent)', false)).join('')
             : '<div class="bli">No browsing recorded.</div>')+
           ((d.projects||[]).length ? `<h2>What you built</h2>`+
             d.projects.map(p=>bar(p.project, Math.round(p.mins/Math.max(...d.projects.map(x=>x.mins),1)*100),
                                   `${p.mins}m`, 'var(--s7)', false)).join('') : '')+
         `</div>
       </div>

       <h2>Last seven days</h2><div class="week">`+
         (d.weekDays||[]).map(w=>`<div class="wd ${w.date===d.date?'today':''}" title="${w.date} · ${durm(w.secs)}">`+
           `<i style="height:${Math.round(w.secs/maxWeek*100)}%"></i><span>${dayName(w.date)}</span></div>`).join('')+
       `</div>`;
  }

  if (view==='apps'){
    if (!d.apps || !d.apps.length) return pane.innerHTML =
      '<div class="none">No samples for this day.<br>Check the menu bar — recording may be paused.</div>';
    // Hues are assigned across every app in the week, not just today, so a column keeps its
    // colours as you move between days.
    assignHues([...d.weekApps.map(a=>a.app), ...d.apps.map(a=>a.app)]);
    const top = d.weekApps.slice(0,7).map(a=>a.app);
    const maxDay = Math.max(...(d.weekDays||[]).map(w=>w.secs), 1);
    const dayName = i => ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(i+'T12:00:00').getDay()];

    // Everything outside the top seven becomes one Other band rather than an invented hue.
    const bands = w => {
      const e = Object.entries(w.byApp||{});
      const named = e.filter(([a])=>top.includes(a)).sort((x,y)=>top.indexOf(x[0])-top.indexOf(y[0]));
      const other = e.filter(([a])=>!top.includes(a)).reduce((t,[,v])=>t+v,0);
      return other > 0 ? [...named, ['Other', other]] : named;
    };
    const colOf = a => a==='Other' ? 'var(--faint)' : hue(a);

    pane.innerHTML =
      `<p class="lede"><span class="big">${durm(d.active)}</span> across <b>${d.apps.length}</b> apps today, `+
      `with <b>${d.switches}</b> switches — about <b>${d.switchesPerHour}</b> an hour.`+
      (d.longest?` The longest you stayed put was <b>${durm(d.longest.secs)}</b> in ${esc(d.longest.app)}.`:'')+`</p>

      <h2>Today's mix <span>— share of time at the machine</span></h2>
      <div class="share">`+
        d.apps.filter(a=>a.pct>=1).map(a=>
          `<i style="width:${a.pct}%;background:${hue(a.app)}" title="${esc(a.app)} · ${durm(a.secs)} · ${a.pct}%">`+
          (a.pct>=9?`<span>${esc(a.app)} ${a.pct}%</span>`:'')+`</i>`).join('')+
      `</div>

      <h2>The week, by composition <span>— column height is time, bands are apps</span></h2>
      <div class="stackwrap">`+
        (d.weekDays||[]).map(w=>{
          const h = Math.round(w.secs/maxDay*100);
          const bs = bands(w);
          return `<div class="stackday ${w.date===d.date?'today':''}">
            <div class="stackcol" style="height:${h}%">`+
              bs.map(([a,v])=>`<i style="flex:${v};background:${colOf(a)}" title="${esc(a)} · ${durm(v)}"></i>`).join('')+
            `</div>
            <div class="stacklab"><b>${dayName(w.date)}</b>${w.secs?durm(w.secs):'—'}</div>
          </div>`;
        }).join('')+
      `</div>
      <div class="legend">`+
        [...top, ...(( d.weekDays||[]).some(w=>bands(w).some(([a])=>a==='Other'))?['Other']:[])]
          .map(a=>`<span><i style="background:${colOf(a)}"></i>${esc(a)}</span>`).join('')+
      `</div>`;
  }



  if (view==='threads'){
    if (!d.threads || !d.threads.length) return pane.innerHTML =
      `<div class="none">No recurring work found in ${d.notesConsidered||0} notes.<br>Threads need a few days of history before they mean anything.</div>`;
    const est = d.threads.filter(t=>t.established);
    // The run strip needs a fixed calendar so every thread's cells line up day for day.
    const span = Math.min(d.days, 21);
    const cal = [];
    for (let i=span-1;i>=0;i--){ const x=new Date(); x.setDate(x.getDate()-i);
      cal.push(`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`); }
    const LABEL={today:'today',active:'yesterday',warm:'this week',quiet:'quiet'};

    pane.innerHTML =
      `<p class="lede"><span class="big">${d.threads.length}</span> thread${d.threads.length===1?'':'s'} running, `+
      `<b>${est.length}</b> of them across more than one day. `+
      `${d.unclustered} note${d.unclustered===1?'':'s'} didn't belong to any.</p>`+
      ((d.openLoops||[]).length
        ? `<div class="loops"><h3>Picked up and put down</h3>`+
          d.openLoops.map(t=>`<div><b>${esc(t.name)}</b> — last touched ${t.idleDays} day${t.idleDays===1?'':'s'} ago, after ${t.days} days of work</div>`).join('')+
          `</div>` : '')+
      d.threads.map(t=>{
        const active = new Set(t.when.map(w=>w.date));
        return `<div class="thread">
          <div class="tstate"><span class="pill ${t.state}">${LABEL[t.state]||t.state}</span></div>
          <div>
            <div class="tname">${esc(t.name)}${t.established?'':'<span class="tnew">new</span>'}</div>
            <div class="tmeta">${t.notes} notes · ${t.days} day${t.days===1?'':'s'} · ${t.minutes}m`+
              (t.sites.length?` · ${esc(t.sites.slice(0,3).join(', '))}`:'')+`</div>
            ${t.titles.length?`<div class="tsum">${esc(t.titles[0])}</div>`:''}
            <div class="trun" title="${esc(t.first)} → ${esc(t.last)}">`+
              cal.map(dt=>`<i class="${active.has(dt)?'on':''}" title="${dt}"></i>`).join('')+
            `</div>
          </div>
        </div>`;
      }).join('');
  }

  if (view==='people'){
    if (!d.people || !d.people.length) return pane.innerHTML =
      `<div class="none">No contacts found yet.<br>People are read from meeting, chat and mail window titles as they accumulate.</div>`;
    const days = d.dates || [];
    const ago = n => n===0?'today':n===1?'yesterday':n+'d ago';
    const chIcon = c => /teams/i.test(c)?'💬':/zoom/i.test(c)?'🎦':/outlook|mail/i.test(c)?'✉️':/slack/i.test(c)?'#':'·';
    const spark = (p,h=24) => { const v=days.map(x=>p.perDay[x]||0), mx=Math.max(...v,1);
      return `<span class="pspark" style="height:${h}px">`+v.map(x=>`<i style="height:${Math.max(2,Math.round(x/mx*h))}px"></i>`).join('')+`</span>`; };
    pane.innerHTML =
      (d.cold.length
        ? `<div class="pcold"><h3>Going cold</h3><div class="pcoldrow">`+
          d.cold.slice(0,6).map(p=>`<button class="pchip" data-p="${esc(p.name)}"><b>${esc(p.name)}</b> <span>${ago(p.daysAgo)}</span></button>`).join('')+`</div></div>`
        : '')+
      `<p class="lede"><span class="big">${d.people.length}</span> people, last ${d.days} days. Derived from what happened, nothing entered by hand.</p>`+
      `<table class="ptable"><thead><tr><th>Name</th><th>Channel</th><th>Contact</th><th class="pn">×</th><th>Last</th><th>Trend</th><th>What</th></tr></thead><tbody>`+
      d.people.map(p=>`<tr data-p="${esc(p.name)}">
        <td class="pnm">${esc(p.name)}</td>
        <td class="pch">${chIcon(p.channel)} ${esc(p.channel.replace('Microsoft ',''))}</td>
        <td>${spark(p)}</td><td class="pn">${p.freq}</td>
        <td class="plast">${ago(p.daysAgo)}</td>
        <td><span class="ptr ${p.trend}">${p.trend}</span></td>
        <td class="ptopic">${esc((p.topics[0]||'—').replace(/\.(docx?|xlsx?|pptx?)$/,''))}</td>
      </tr>`).join('')+`</tbody></table>`;
    pane.querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>{
      const p=d.people.find(x=>x.name===el.dataset.p); if(!p)return;
      const dr=document.getElementById('pdrawer'), sc=document.getElementById('pscrim');
      dr.innerHTML=`<h3>${esc(p.name)}</h3>
        <div class="pmeta">${esc(p.channel.replace('Microsoft ',''))} · ${p.freq} contacts across ${p.daysActive} days · last ${ago(p.daysAgo)}</div>
        <div class="pdsec"><div class="plbl">Contact rhythm</div>${spark(p,40).replace('pspark','pdstrip')}</div>
        <div class="pdsec"><div class="plbl">Worked on together</div>`+
        (p.topics.length?p.topics.map(t=>`<div class="pdtopic">${esc(t)}</div>`).join(''):`<div class="pnote">Fills in as content capture runs.</div>`)+`</div>
        <div class="pdsec"><div class="plbl">Trend</div><span class="ptr ${p.trend}">${p.trend}</span>
        <div class="pnote">${p.trend==='cold'?'Not in contact recently. Worth a check-in.':p.trend==='fading'?'Tapering off from earlier.':p.trend==='rising'?'Picking up.':'Steady.'}</div></div>`;
      dr.classList.add('on'); sc.classList.add('on');
    });
  }

  if (view==='reading'){
    if (!d.items || !d.items.length) return pane.innerHTML =
      `<div class="none">Nothing surfaced yet.<br>Work documents and pages you read appear here, across every app.</div>`;
    const srcTag = s => s==='doc'?'document':s==='app'?'app':'web';
    pane.innerHTML =
      `<p class="lede"><span class="big">${d.count}</span> things read, last ${d.days} days. Documents and work pages across every app, news and entertainment stripped.</p>`+
      `<div class="rdlist">`+d.items.slice(0,60).map(r=>`<div class="rdrow">
        <div class="rdmin">${r.minutes}m</div>
        <div class="rdbody">${r.url
            ? `<a class="rdtitle" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title.replace(/ - Google Chrome.*$/,''))}</a>`
            : `<div class="rdtitle">${esc(r.title.replace(/ - Google Chrome.*$/,''))}</div>`}
          <div class="rdmeta"><span class="rdsrc ${r.source}">${srcTag(r.source)}</span> ${esc(r.host||r.app)} · ${r.days} day${r.days===1?'':'s'} · last ${r.daysAgo===0?'today':r.daysAgo+'d ago'}</div>
        </div></div>`).join('')+`</div>`;
  }

  if (view==='permissions'){
    const P = await (await fetch('/api/permissions')).json();
    const CFG = await (await fetch('/api/config')).json();
    const SRC = (await (await fetch('/api/sources')).json()).sources || [];
    const group = (label, kind, mode, list, placeholder, help) => {
      const inc = mode === 'include';
      return `<div class="pgroup">
        <div class="phead"><h2>${label}</h2>
          <span class="pmode">
            <button class="${inc?'':'on'}" data-mode="exclude" data-kind="${kind}">Exclude these</button>
            <button class="${inc?'on':''}" data-mode="include" data-kind="${kind}">Include only these</button>
          </span>
        </div>
        <div class="pnote">${help}</div>
        ${inc && !list.length ? `<div class="empty-allow">Nothing is being recorded — an include-only list that is empty allows nothing.</div>` : ''}
        <div class="rules">`+
          (list.length ? list.map(v=>`<span class="rule">${esc(v)}<button data-del="${esc(v)}" data-kind="${kind}" title="Remove">×</button></span>`).join('')
                       : `<span class="pnote">${inc?'':'Nothing excluded — everything is recorded.'}</span>`)+
        `</div>
        <div class="addrule">
          <input data-add="${kind}" placeholder="${placeholder}" autocomplete="off">
          <button data-addbtn="${kind}">Add</button>
        </div>
      </div>`;
    };

    pane.innerHTML =
      `<p class="lede">You choose what contributes. Rules apply to <b>future</b> history — to remove what is already recorded, clear it below.</p>`+
      `<div class="pgroup">
         <div class="phead"><h2>Collection</h2></div>
         <div class="pnote">${P.paused ? 'Paused. Nothing is being recorded.' : 'Recording. A note is written every ten minutes you are at the machine.'}</div>
         <div class="clearbar"><button id="pPause">${P.paused?'Resume recording':'Pause recording'}</button></div>
       </div>`+
      `<div class="pgroup">
         <div class="phead"><h2>What contributes</h2></div>
         <div class="pnote">Each source is a separate decision. Switching one off stops it being read from now on; what it already wrote stays until you clear it.</div>
         <div id="srcRows"></div>
       </div>`+
      `<div class="pgroup">
         <div class="phead"><h2>Who writes the notes</h2></div>
         <div class="pnote">Notes are written every ten minutes. This chooses what does the writing.</div>
         <div class="clearbar">`+
           [['local','This Mac','Keyword summaries. Nothing leaves the machine.'],
            ['claude-cli','Claude Code','Full sentences, via the claude command you already have.'],
            ['api','API key','Full sentences, via ANTHROPIC_API_KEY.']]
             .map(([id,label,note])=>`<button data-summ="${id}" class="${CFG.summarizer===id?'on':''}"`+
               ` title="${esc(note)}">${esc(label)}${CFG.summarizer===id?' ✓':''}</button>`).join('')+
         `</div>
         <div class="pnote" style="margin-top:8px" id="summNote"></div>
       </div>`+
      group('Apps', 'app', P.appMode, P.appMode==='include'?P.includeApps:P.excludeApps,
            'App name, or a pattern like 1Password*',
            'Matching is case-insensitive; <code>*</code> is a wildcard. Applied before anything is written, so a blocked app never reaches disk.')+
      group('Websites', 'site', P.siteMode, P.siteMode==='include'?P.includeSites:P.excludeSites,
            'Domain, or a pattern like *bank*',
            'Private browsing is never included — your browser does not record it, so My Day cannot read it.')+
      `<div class="pgroup">
         <div class="phead"><h2>Clear history</h2></div>
         <div class="pnote">Deletes the notes and the raw events behind them, so a rollup cannot rewrite what you cleared. This cannot be undone.</div>
         <div class="clearbar">
           <button data-clear="10m">Last 10 minutes</button>
           <button data-clear="hour">Last hour</button>
           <button data-clear="day">Last day</button>
           <button data-clear="all" class="danger">Everything</button>
         </div>
       </div>`;

    const post = async (body) => { await fetch('/api/permission',{method:'POST',
      headers:{'content-type':'application/json'},body:JSON.stringify(body)}); renderPane(); };

    pane.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>post({kind:b.dataset.kind, mode:b.dataset.mode}));
    pane.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>post({kind:b.dataset.kind, value:b.dataset.del, on:false}));
    pane.querySelectorAll('[data-addbtn]').forEach(b=>b.onclick=()=>{
      const inp = pane.querySelector(`[data-add="${b.dataset.addbtn}"]`);
      if (inp.value.trim()) post({kind:b.dataset.addbtn, value:inp.value.trim(), on:true});
    });
    pane.querySelectorAll('[data-add]').forEach(i=>i.onkeydown=e=>{
      if (e.key==='Enter' && i.value.trim()) post({kind:i.dataset.add, value:i.value.trim(), on:true});
    });
    const SUMM_NOTE = {
      local:'Titles are built from what you had open. No model runs and nothing is sent.',
      'claude-cli':'Each note is sent to Claude to be written. Every send is appended to ~/.myday/egress.log.',
      api:'Each note is sent to the API to be written. Every send is appended to ~/.myday/egress.log.',
    };
    const sn = pane.querySelector('#summNote');
    if (sn) sn.textContent = SUMM_NOTE[CFG.summarizer] || SUMM_NOTE.local;

    const rows = pane.querySelector('#srcRows');
    if (rows) rows.innerHTML = SRC.filter(x=>!x.planned).map(x=>`
      <div class="srow${x.available?'':' off'}">
        <div>
          <div class="sname">${esc(x.name)}</div>
          <div class="pnote">${esc(x.what)}</div>
          <div class="pnote dim">${esc(x.detail || '')}</div>
        </div>
        ${x.required ? '<span class="salways">always on</span>'
          : !x.available ? '<span class="salways">not found</span>'
          : `<button class="stog${x.enabled?' on':''}" data-src="${x.id}" data-next="${x.enabled?0:1}">${x.enabled?'On':'Off'}</button>`}
      </div>`).join('');

    pane.querySelectorAll('[data-src]').forEach(b=>b.onclick=async()=>{
      await fetch('/api/sources',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({id:b.dataset.src,enabled:b.dataset.next==='1'})});
      renderPane();
    });

    pane.querySelectorAll('[data-summ]').forEach(b=>b.onclick=async()=>{
      await fetch('/api/config',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({summarizer:b.dataset.summ})});
      renderPane();
    });
    const pp = pane.querySelector('#pPause');
    if (pp) pp.onclick = () => post({paused: !P.paused});
    pane.querySelectorAll('[data-clear]').forEach(b=>b.onclick=async()=>{
      const w = b.dataset.clear;
      if (w==='all' && !confirm('Delete every note and every raw sample? This cannot be undone.')) return;
      const r = await (await fetch('/api/clear',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({what:w})})).json();
      b.textContent = `${r.notes} notes, ${r.samples} samples cleared`;
      setTimeout(()=>load(D.date), 1200);
    });
  }

}

document.getElementById('tabs').onclick = e => {
  const b = e.target.closest('.tab'); if (!b) return;
  view = b.dataset.v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t===b));
  renderPane();
};
document.getElementById('q').oninput  = () => render();
document.getElementById('date').onchange = e => {
  load(e.target.value);
  // Keep the URL pointing at the day being read, so a day can be linked or reloaded.
  const u = new URL(location); u.searchParams.set('date', e.target.value);
  history.replaceState(null, '', u);
};
// The window stays open for days, so the page has to notice that the day changed. Without
// this it kept rendering whichever date it first loaded, even after midnight.
const todayStr = () => { const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
let loadedOn = todayStr();

function refresh() {
  // Someone who deliberately picked an older day stays on it. Only a page that was showing
  // today follows the calendar forward.
  if (D && D.date === loadedOn && todayStr() !== loadedOn) { loadedOn = todayStr(); load(undefined); }
  else load(D ? D.date : undefined);
}
window.addEventListener('focus', refresh);
// Notes land every ten minutes, so a window left open should show them without being touched.
setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 5 * 60 * 1000);

load(new URLSearchParams(location.search).get('date') || undefined);
</script>
<div id="pscrim" onclick="document.getElementById('pdrawer').classList.remove('on');this.classList.remove('on')"></div>
<aside id="pdrawer"></aside>
</body>
</html>
