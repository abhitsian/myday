<style>
:root{
  --bg:#faf9f6; --card:#fffefc; --sunk:#f2f0ea; --ink:#16150f; --mut:#5f5b50;
  --faint:#96917f; --line:#e7e3d7; --accent:#4f6285; --warn:#a4661d; --cold:#8a8378;
  /* single-hue sequential ramp for intensity, validated warm→dark, not a rainbow */
  --h0:#f2f0ea; --h1:#dfe3ea; --h2:#b9c3d6; --h3:#8496b9; --h4:#5a6f97; --h5:#3c4d70;
  --num:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;padding:40px 32px 80px;max-width:1080px;margin:0 auto}
h1{font-size:30px;font-weight:680;letter-spacing:-.02em}
.sub{color:var(--mut);margin:6px 0 2px;max-width:64ch}
.mono{font-family:var(--num)}

/* going cold — the hero, because a derived CRM's one job is catching what you'd miss */
.cold{margin:30px 0 36px;padding:20px 22px;background:var(--card);
  border:1px solid var(--line);border-radius:14px}
.cold h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);font-weight:640;
  display:flex;align-items:center;gap:7px}
.cold h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none}
.cold .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.cold .who{display:flex;align-items:baseline;gap:8px;padding:8px 12px;background:var(--sunk);
  border-radius:10px;cursor:pointer;transition:transform .1s}
.cold .who:hover{transform:translateY(-1px)}
.cold .who b{font-weight:600}
.cold .who .ago{font-family:var(--num);font-size:12px;color:var(--cold)}

/* the list */
.hd{display:flex;align-items:center;justify-content:space-between;margin:34px 0 4px}
.hd .seg{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:9px}
.hd .seg button{font:inherit;font-size:13px;padding:5px 13px;border:0;border-radius:7px;
  background:transparent;color:var(--mut);cursor:pointer}
.hd .seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05)}

table{width:100%;border-collapse:collapse;margin-top:10px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--faint);font-weight:600;padding:0 12px 10px;border-bottom:1px solid var(--line)}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr{cursor:pointer}
tr:hover td{background:var(--card)}
.nm{font-weight:600}
.ch{font-size:12.5px;color:var(--mut)}
.spark{display:flex;gap:2px;align-items:flex-end;height:26px}
.spark i{width:5px;background:var(--accent);border-radius:1.5px;opacity:.85;min-height:2px}
.freq{font-family:var(--num);font-size:13px;color:var(--mut);width:44px;text-align:right}
.last{font-family:var(--num);font-size:12.5px;color:var(--cold)}
.tr{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.tr.rising{color:#2f6b3d;background:#e6f1e8}
.tr.fading{color:#8a5a12;background:#f6ecdb}
.tr.steady{color:var(--mut);background:var(--sunk)}
.tr.cold{color:var(--warn);background:#f6e6d6}
.topics{color:var(--mut);font-size:13px;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* heatmap */
#heat{display:none}
.hmrow{display:grid;grid-template-columns:180px 1fr;align-items:center;gap:14px;padding:3px 0}
.hmname{font-size:13.5px;font-weight:560;text-align:right;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmcells{display:grid;gap:3px}
.hmc{aspect-ratio:1;border-radius:3px;background:var(--h0)}
.hmaxis{display:grid;grid-template-columns:180px 1fr;gap:14px;margin-top:8px}
.hmdays{display:grid;font-family:var(--num);font-size:10px;color:var(--faint)}
.hmdays span{text-align:center}

/* detail drawer */
#scrim{position:fixed;inset:0;background:rgba(20,18,12,.28);opacity:0;pointer-events:none;transition:opacity .18s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);background:var(--bg);
  border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s cubic-bezier(.16,1,.3,1);
  padding:34px 30px;overflow-y:auto}
#drawer.on{transform:none}
#drawer h3{font-size:24px;font-weight:680;letter-spacing:-.01em}
#drawer .meta{font-family:var(--num);font-size:12.5px;color:var(--mut);margin-top:6px}
.dsec{margin-top:26px}
.dsec .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;margin-bottom:10px}
.dtopic{padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:9px;margin-bottom:7px;font-size:13.5px}
.dstrip{display:flex;gap:2px;align-items:flex-end;height:40px}
.dstrip i{flex:1;background:var(--accent);border-radius:2px;opacity:.85;min-height:2px}
.note{color:var(--faint);font-size:12.5px;margin-top:8px}
.foot{margin-top:44px;color:var(--faint);font-size:12.5px;border-top:1px solid var(--line);padding-top:16px}
</style>

<h1>People</h1>
<p class="sub">Everyone you were in contact with, and when. Nothing here was entered by hand.
It is read from the meetings, chats and mail that already happened on this Mac.</p>

<div class="cold">
  <h2>Going cold</h2>
  <div class="row" id="coldrow"></div>
</div>

<div class="hd">
  <div style="font-size:13px;color:var(--mut)"><span id="count"></span> people · last 16 days</div>
  <div class="seg">
    <button class="on" data-v="list">List</button>
    <button data-v="heat">Rhythm</button>
  </div>

<div id="list"></div>

<script>
const D = window.CRM, P = D.people, DAYS = D.days;
const $ = s => document.querySelector(s);
const chIcon = c => /teams/i.test(c)?'💬':/zoom/i.test(c)?'🎦':/outlook|mail/i.test(c)?'✉️':/slack/i.test(c)?'#':'·';
const ago = d => d===0?'today':d===1?'yesterday':d+'d ago';
const spark = (p, h=26) => {
  const vals = DAYS.map(d=>p.perDay[d]||0), mx = Math.max(...vals,1);
  return `<div class="spark" style="height:${h}px">`+vals.map(v=>
    `<i style="height:${Math.max(2,Math.round(v/mx*h))}px"></i>`).join('')+`</div>`;
};

// going cold
$('#coldrow').innerHTML = P.filter(p=>p.trend==='cold'||p.daysAgo>=4)
  .sort((a,b)=>b.daysAgo-a.daysAgo).slice(0,6)
  .map(p=>`<div class="who" data-n="${p.name}"><b>${p.name}</b><span class="ago">${ago(p.daysAgo)}</span></div>`).join('')
  || '<span class="note">No one has gone quiet. Everyone you talk to regularly, you talked to this week.</span>';

// list
$('#count').textContent = P.length;
$('#list').innerHTML = `<table><thead><tr>
  <th>Name</th><th>Channel</th><th>Contact over 16 days</th><th class="freq">×</th>
  <th>Last</th><th>Trend</th><th>What</th></tr></thead><tbody>`+
  P.map(p=>`<tr data-n="${p.name}">
    <td class="nm">${p.name}</td>
    <td class="ch">${chIcon(p.channel)} ${p.channel.replace('Microsoft ','')}</td>
    <td>${spark(p)}</td>
    <td class="freq">${p.freq}</td>
    <td class="last">${ago(p.daysAgo)}</td>
    <td><span class="tr ${p.trend}">${p.trend}</span></td>
    <td class="topics">${(p.topics[0]||'—').replace(/\.(docx?|xlsx?|pptx?)$/,'')}</td>
  </tr>`).join('')+`</tbody></table>`;

// heatmap
const mx = Math.max(...P.flatMap(p=>DAYS.map(d=>p.perDay[d]||0)),1);
const bucket = v => v===0?'var(--h0)':`var(--h${Math.min(5,Math.ceil(v/mx*5))})`;
$('#heat').innerHTML = P.map(p=>`<div class="hmrow" data-n="${p.name}">
  <div class="hmname">${p.name}</div>
  <div class="hmcells" style="grid-template-columns:repeat(${DAYS.length},1fr)">`+
  DAYS.map(d=>`<div class="hmc" style="background:${bucket(p.perDay[d]||0)}" title="${d}: ${p.perDay[d]||0}"></div>`).join('')+
  `</div></div>`).join('')+
  `<div class="hmaxis"><div></div><div class="hmdays" style="grid-template-columns:repeat(${DAYS.length},1fr)">`+
  DAYS.map((d,i)=>`<span>${i%3===0?d.slice(8):''}</span>`).join('')+`</div></div>`;

// view toggle
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));
  const v=b.dataset.v; $('#list').style.display=v==='list'?'block':'none';
  $('#heat').style.display=v==='heat'?'block':'none';
});

// drawer
function open(name){
  const p = P.find(x=>x.name===name); if(!p) return;
  $('#drawer').innerHTML = `<h3>${p.name}</h3>
    <div class="meta">${p.channel.replace('Microsoft ','')} · ${p.freq} contacts across ${p.daysActive} days · last ${ago(p.daysAgo)}</div>
    <div class="dsec"><div class="lbl">Contact rhythm</div>${spark(p,40).replace('spark','dstrip')}
      <div class="note">Each bar is a day. Aug 10 to 25.</div></div>
    <div class="dsec"><div class="lbl">What you worked on together</div>`+
    (p.topics.length?p.topics.map(t=>`<div class="dtopic">${t}</div>`).join('')
      :`<div class="note">Documents and pages will fill in here as content capture runs. Today this is derived from shared file names in the window.</div>`)+
    `</div>
    <div class="dsec"><div class="lbl">Trend</div><span class="tr ${p.trend}">${p.trend}</span>
      <div class="note">${p.trend==='cold'?'You have not been in contact recently. Worth a check-in.':
        p.trend==='fading'?'Contact is tapering off from earlier in the fortnight.':
        p.trend==='rising'?'Contact is picking up.':'Steady contact.'}</div></div>`;
  $('#drawer').classList.add('on'); $('#scrim').classList.add('on');
}
document.body.addEventListener('click',e=>{
  const el=e.target.closest('[data-n]'); if(el) open(el.dataset.n);
});
$('#scrim').onclick=()=>{$('#drawer').classList.remove('on');$('#scrim').classList.remove('on')};

$('#foot').textContent = `Derived from ${DAYS.length} days of activity, no manual entry. `+
  `Names are read from meeting, chat and mail window titles; this data never leaves the Mac unless you enable a cloud summariser.`;
</script>
